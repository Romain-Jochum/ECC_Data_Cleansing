[project]
name = "ecc-data-cleansing"
version = "1.0.0"
description = "A comprehensive data cleaning pipeline developed during an academic exchange at École Centrale Casablanca. Demonstrates data exploration, validation, and preprocessing techniques for production-ready datasets."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "fuzzywuzzy>=0.18.0",
    "python-Levenshtein>=0.21.0",
    "nltk>=3.8.0",
    "nomquamgender>=1.0.0",
    "wordcloud>=1.9.0",
    "seaborn>=0.12.0",
    "matplotlib>=3.7.0",
    "basemap>=1.1.0",
    "pypi-cdecimal>=2.3.0",
    "difflib2>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0.0",
    "ipykernel>=6.25.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"
